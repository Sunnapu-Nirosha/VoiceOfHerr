<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8336A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4508B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CE93D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8BBD0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="98" fill="url(#logoGrad)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
  
  <!-- Female symbol - Venus -->
  <circle cx="100" cy="72" r="22" fill="none" stroke="white" stroke-width="5"/>
  <line x1="100" y1="94" x2="100" y2="140" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="78" y1="118" x2="122" y2="118" stroke="white" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Speech bubble representing "Voice" -->
  <path d="M130 55 Q155 55 155 78 Q155 95 135 98 L128 108 L122 95 Q110 98 105 90 Q100 82 100 72 Q100 55 118 55 Z" 
        fill="white" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Dots inside speech bubble for "..." -->
  <circle cx="118" cy="75" r="3" fill="#B8336A"/>
  <circle cx="130" cy="75" r="3" fill="#B8336A"/>
  <circle cx="142" cy="75" r="3" fill="#B8336A"/>
</svg>
