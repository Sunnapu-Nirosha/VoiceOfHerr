<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency SOS | Voice of Her</title>
  <link rel="stylesheet" href="style.css?v=3" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script type="module" src="fire.js?v=3"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 60%, #020617 100%);
      min-height: 100vh; display: flex; flex-direction: column; color: white;
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif); overflow-x: hidden;
    }
    
    /* Top Header */
    .sos-header {
      padding: 20px 40px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px); position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    }
    .sos-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
    .sos-logo img { width: 36px; height: 36px; border-radius: 50%; }
    .sos-logo span { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 500; }
    
    .sos-nav-right { display: flex; align-items: center; gap: 16px; }
    .sos-back-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: white; font-size: 0.88rem; font-weight: 600;
      text-decoration: none; transition: all 0.2s ease; backdrop-filter: blur(8px);
    }
    .sos-back-btn:hover { background: rgba(255,255,255,0.2); transform: translateX(-2px); }

    /* Fullscreen Content Area */
    .sos-fullscreen-container {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 100px 24px 40px; width: 100%; max-width: 800px;
      margin: 0 auto; text-align: center; position: relative;
    }

    .sos-title-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171; padding: 6px 16px; border-radius: 30px; font-size: 0.82rem;
      font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px;
    }
    .sos-title-badge i { animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .sos-heading { font-family: var(--font-serif); font-size: 3rem; font-weight: 500; margin-bottom: 8px; line-height: 1.1; }
    .sos-subtext { font-size: 1.05rem; color: rgba(255,255,255,0.7); max-width: 480px; margin-bottom: 32px; line-height: 1.5; }

    /* Giant Interactive SOS Button */
    .sos-btn-wrapper { position: relative; margin: 20px 0 36px; }
    
    .sos-ripple-1, .sos-ripple-2 {
      position: absolute; inset: -20px; border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.4); animation: ripple 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .sos-ripple-2 { animation-delay: 1.25s; }
    @keyframes ripple {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    .sos-btn {
      width: 230px; height: 230px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #EF4444, #DC2626 60%, #991B1B 100%);
      border: 4px solid rgba(255, 255, 255, 0.3); color: white;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 0 80px rgba(239, 68, 68, 0.5), inset 0 4px 12px rgba(255,255,255,0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative; cursor: pointer; user-select: none; margin: 0 auto;
    }
    .sos-btn:hover { transform: scale(1.06); box-shadow: 0 0 110px rgba(239, 68, 68, 0.7), inset 0 4px 16px rgba(255,255,255,0.4); }
    .sos-btn:active { transform: scale(0.96); box-shadow: 0 0 50px rgba(239, 68, 68, 0.6); }

    .sos-btn i { font-size: 4rem; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
    .sos-btn span { font-size: 1.1rem; font-weight: 800; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

    /* Location & Status */
    .sos-status {
      display: inline-flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.7); font-size: 0.9rem; background: rgba(255,255,255,0.06);
      padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 24px;
    }
    .sos-status i { color: #38BDF8; }

    .sos-alert {
      padding: 14px 24px; border-radius: 12px; color: white;
      font-weight: 600; font-size: 0.95rem; display: none; width: 100%; max-width: 480px; margin: 0 auto 24px;
    }

    /* Contacts Drawer */
    .sos-contacts-card {
      width: 100%; max-width: 520px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px;
      backdrop-filter: blur(10px); text-align: left;
    }
    .sos-contacts-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sos-contacts-head h3 { font-size: 1rem; font-weight: 600; color: white; display: flex; align-items: center; gap: 10px; }
    .sos-contacts-head h3 i { color: #F87171; }
    
    .sos-contact-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(255,255,255,0.06); border-radius: 12px;
      margin-bottom: 8px; color: white; font-size: 0.9rem;
    }
    .sos-contact-item span { font-weight: 600; }
    .sos-no-contacts { text-align: center; color: rgba(255,255,255,0.4); padding: 16px; font-size: 0.88rem; }

    @media (max-width: 768px) {
      .sos-header { padding: 16px 20px; }
      .sos-heading { font-size: 2.2rem; }
      .sos-btn { width: 190px; height: 190px; }
      .sos-btn i { font-size: 3.2rem; }
      .sos-fullscreen-container { padding: 90px 16px 30px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="sos-header">
  <a href="dashboard.html" class="sos-logo">
    <img src="images/new_logo.png" alt="Voice of Her" />
    <span>Voice of Her</span>
  </a>
  <div class="sos-nav-right">
    <a href="dashboard.html" class="sos-back-btn">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</header>

<!-- Fullscreen SOS Central View -->
<div class="sos-fullscreen-container">
  <div class="sos-title-badge">
    <i class="fas fa-circle"></i> Live Safety System
  </div>
  
  <h1 class="sos-heading">Emergency SOS</h1>
  <p class="sos-subtext">Tap the emergency button below to dispatch immediate location alerts to your contacts & emergency services.</p>

  <div class="sos-status" id="location-status">
    <i class="fas fa-location-dot"></i> Acquiring GPS coordinates...
  </div>

  <!-- Giant Center SOS Button -->
  <div class="sos-btn-wrapper">
    <div class="sos-ripple-1"></div>
    <div class="sos-ripple-2"></div>
    <button class="sos-btn" id="sos-btn" title="Click to trigger emergency SOS alert">
      <i class="fas fa-shield-cat"></i>
      <span>PRESS SOS</span>
    </button>
  </div>

  <div class="sos-alert" id="alert-status"></div>

  <!-- Emergency Contacts Display -->
  <div class="sos-contacts-card">
    <div class="sos-contacts-head">
      <h3><i class="fas fa-users-viewfinder"></i> Emergency Contacts Notified</h3>
    </div>
    <div id="contacts-list">
      <div class="sos-no-contacts">Loading emergency contacts...</div>
    </div>
  </div>
</div>

<script type="module">


  if (!window.isLoggedIn()) window.location.href = 'index.html';

  // Load contacts for SOS view
  async function loadContacts() {
    try {
      const contacts = await window.getEmergencyContacts();
      const list = document.getElementById('contacts-list');
      if (contacts && contacts.length > 0) {
        list.innerHTML = contacts.map(c =>
          '<div class="sos-contact-item">' +
            '<span><i class="fas fa-user-shield" style="margin-right:10px;color:#F87171;"></i>' + (c.name || 'Contact') + '</span>' +
            '<span style="font-family:monospace;">' + (c.phone || '') + '</span>' +
          '</div>'
        ).join('');
      } else {
        list.innerHTML = '<div class="sos-no-contacts">No emergency contacts configured yet</div>';
      }
    } catch (e) {
      document.getElementById('contacts-list').innerHTML = '<div class="sos-no-contacts">Could not load contacts</div>';
    }
  }
  loadContacts();
</script>
<script src="fcm-init.js"></script>
<script src="sos-handler.js"></script>
</body>
</html>
